  :root {
    --red: #9E2B25; --red-deep: #7A1E1A; --gold: #E8B84B;
    --gold-bright: #F6D879; --cream: #F5EFE2; --paper: #EDE4D2;
    --ink: #2A2320; --muted: #6b5a4f;
    --hairline: rgba(158, 43, 37, 0.16);
    /* 4pt-based spacing scale; the two largest steps breathe on wider screens */
    --space-2xs: 4px; --space-xs: 8px; --space-sm: 12px;
    --space-md: 16px; --space-lg: 24px;
    --space-xl: clamp(28px, 5vw, 44px);
    --space-2xl: clamp(40px, 8vw, 72px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--cream); color: var(--ink);
    font-family: "Noto Sans TC", sans-serif;
    line-height: 1.6;
    padding: max(20px, env(safe-area-inset-top)) 18px 48px;
  }
  .wrap { max-width: 680px; margin: 0 auto; }

  /* --- Header: a small carved nameplate, never default chrome --- */
  .masthead { margin-bottom: var(--space-xl); }
  h1#title {
    font-family: "Noto Serif TC", "Songti TC", serif;
    font-weight: 900; font-size: clamp(1.75rem, 6vw, 2rem);
    color: var(--red); letter-spacing: 0.04em; margin-bottom: var(--space-2xs);
    text-wrap: balance;
  }
  .subtitle { color: var(--muted); font-size: 0.95rem; margin: 0; }
  .subtitle a { color: var(--red); }

  h2.section {
    font-family: "Noto Serif TC", "Songti TC", serif;
    font-size: 1.25rem; font-weight: 700; color: var(--ink);
    margin: 0 0 var(--space-sm);
  }

  /* Rhythm: hero leads, then a generous break to the "make your own" controls,
     then the supporting cast (explainer, reference) drops below a hairline. */
  .controls { margin-top: var(--space-2xl); }
  .explain-wrap, .reference {
    margin-top: var(--space-2xl);
    padding-top: var(--space-xl);
    border-top: 1px solid var(--hairline);
  }

  /* --- Category toggles --- */
  .cats { display: flex; flex-wrap: wrap; gap: 8px 14px; }
  .cat {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 0.95rem; font-weight: 500; cursor: pointer;
    padding: 6px 12px; border-radius: 999px;
    background: var(--paper); border: 1px solid rgba(158, 43, 37, 0.18);
    user-select: none;
  }
  .cat input { accent-color: var(--red); width: 16px; height: 16px; cursor: pointer; }
  .cat:has(input:focus-visible) { outline: 2px solid var(--red); outline-offset: 2px; }

  /* --- Generate button: confident, full-width signboard action --- */
  button.generate {
    width: 100%; margin-top: var(--space-md);
    font-family: inherit; font-size: 1.05rem; font-weight: 700;
    letter-spacing: 0.06em; color: #fff; cursor: pointer;
    background: var(--red); border: none; border-radius: 8px;
    padding: 0.75rem 1rem;
    transition: background 120ms ease, transform 80ms ease;
  }
  button.generate:hover { background: var(--red-deep); }
  button.generate:active { transform: translateY(1px); }
  button.generate:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

  .error { color: var(--red); font-weight: 600; margin-top: var(--space-sm); min-height: 1.2em; }

  /* --- The hero: signboard plaque, present from first paint (seeded in markup) --- */
  .stage {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: var(--space-md); padding: 0;
  }
  .plaque {
    position: relative;
    background: linear-gradient(158deg, #ab322a 0%, #8c2018 58%, #781a13 100%);
    border: 2px solid var(--gold);
    border-radius: 8px;
    padding: clamp(20px, 5vw, 34px) clamp(30px, 8vw, 66px);
    max-width: 100%;
    box-shadow:
      0 20px 44px -20px rgba(58, 10, 6, 0.6),
      inset 0 0 0 5px rgba(0, 0, 0, 0.12),
      inset 0 1px 0 rgba(255, 222, 156, 0.18);
    overflow: hidden;
  }
  .plaque::before {
    content: ""; position: absolute; inset: 8px;
    border: 1px solid rgba(232, 184, 75, 0.45); border-radius: 4px;
    pointer-events: none;
  }
  .name {
    position: relative;
    display: flex; justify-content: center; flex-wrap: nowrap;
    gap: clamp(4px, 1.6vw, 12px);
    font-family: "Zansyu", "Noto Serif TC", "Songti TC", serif; font-weight: 700;
    font-size: clamp(2.6rem, 11vw, 4.8rem); line-height: 1;
    color: var(--gold);
    text-shadow: 0 1px 0 rgba(0, 0, 0, 0.38), 0 0 20px rgba(246, 216, 121, 0.18);
  }
  .name .char { display: inline-block; will-change: transform, opacity; }
  .name::after {
    content: ""; position: absolute; inset: -25% -12%;
    background: linear-gradient(105deg, transparent 42%, rgba(255, 247, 214, 0.55) 50%, transparent 58%);
    transform: translateX(-130%); pointer-events: none;
  }
  .tag {
    font-size: clamp(0.78rem, 2.6vw, 0.95rem); letter-spacing: 0.14em;
    color: var(--cream); background: var(--red);
    border: 1px solid rgba(232, 184, 75, 0.6); border-radius: 999px;
    padding: 5px 15px;
    box-shadow: 0 6px 16px -8px rgba(58, 10, 6, 0.5);
  }
  .tag b { color: var(--gold-bright); font-weight: 700; }

  .copy {
    margin-top: 2px; font-family: inherit; font-size: 0.9rem; font-weight: 500;
    color: var(--red); cursor: pointer;
    background: transparent; border: 1px solid rgba(158, 43, 37, 0.35);
    border-radius: 999px; padding: 5px 14px;
    transition: background 120ms ease, color 120ms ease;
  }
  .copy:hover { background: var(--red); color: #fff; }
  .copy:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

  /* Entrance — applied via JS (.animate), so the default state is visible */
  .animate .plaque { animation: plaque-in 720ms cubic-bezier(.16, 1, .3, 1) both; }
  .animate .char   { animation: char-in 520ms cubic-bezier(.16, 1, .3, 1) both; }
  .animate .name::after { animation: shimmer 1150ms ease-out .55s 1 both; }
  .animate .tag    { animation: fade-up 600ms cubic-bezier(.16, 1, .3, 1) .5s both; }
  @keyframes plaque-in { from { opacity: 0; transform: translateY(14px) scale(.94); } to { opacity: 1; transform: none; } }
  @keyframes char-in   { from { opacity: 0; transform: translateY(-16px) scale(.82); } to { opacity: 1; transform: none; } }
  @keyframes shimmer   { from { transform: translateX(-130%); } to { transform: translateX(130%); } }
  @keyframes fade-up   { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  @media (prefers-reduced-motion: reduce) {
    .animate .plaque, .animate .char, .animate .tag, button.generate { animation: none !important; transition: none; }
    .name::after { display: none; }
  }

  /* --- Explainer --- */
  .explain { font-size: 1rem; max-width: 60ch; }
  .explain li { margin: var(--space-2xs) 0; }
  .explain strong { color: var(--red); }

  /* --- Reference: collapsed by default so it never out-weighs the hero --- */
  .reference > summary {
    font-family: "Noto Serif TC", "Songti TC", serif;
    font-size: 1.25rem; font-weight: 700; color: var(--ink);
    cursor: pointer; list-style: none;
    display: inline-flex; align-items: center; gap: var(--space-xs);
  }
  .reference > summary::-webkit-details-marker { display: none; }
  .reference > summary::after {
    content: "▸"; color: var(--red); font-size: 0.85em;
    transition: transform 160ms cubic-bezier(.16, 1, .3, 1);
  }
  .reference[open] > summary::after { transform: rotate(90deg); }
  figure { margin: var(--space-md) 0 0; max-width: 460px; }
  figure img { width: 100%; height: auto; border-radius: 6px; display: block; }
  figcaption { color: var(--muted); font-size: 0.875rem; margin-top: var(--space-2xs); }
  .credit { color: var(--muted); font-size: 0.8rem; margin-top: var(--space-xs); max-width: 460px; }

  @media (prefers-reduced-motion: reduce) {
    .reference > summary::after { transition: none; }
  }
</style>
</head>

  <main class="wrap">

      <p class="subtitle">上世紀適用 ·

      </p>

    <!-- The hero leads, seeded with a canonical name so the signboard is present
         from first paint (no JS / no tap needed). Generate replays the reveal. -->
    <section class="hero">
      <div class="stage" id="stage">
        <div class="plaque">
          <div class="name" id="name" aria-live="polite"><span class="char">永</span><span class="char">昌</span><span class="char">大</span><span class="char">廈</span></div>
        </div>
        <div class="tag">字頭類別 · <b id="tagcat">時間</b></div>
        <button class="copy" id="copy" type="button">複製名稱</button>
      </div>
    </section>

    <section class="controls">
      <h2 class="section">選擇字頭類別</h2>
      <div class="cats" id="cats"></div>
      <button class="generate" id="generate" type="button" aria-label="隨機生成大廈名稱">🏢 隨機生成大廈名稱</button>
      <p class="error" id="error" role="alert"></p>
    </section>

    <section class="explain-wrap">
      <h2 class="section">命名策略說明</h2>
      <ul class="explain">
        <li><strong>字頭</strong>：根據選擇的類別隨機選擇，包括時間、地方、數量、意頭和其他。</li>
        <li><strong>字尾</strong>：從常用的吉祥字中隨機選擇。</li>
        <li><strong>大廈</strong>：名稱最後加上「大廈」、「大樓」或「樓」。</li>
      </ul>
    </section>

    <details class="reference">
      <summary>參考圖片</summary>
      <figure>
        <img src="461008388_1761486387931403_1695198223138866317_n.jpg" alt="唐樓命名攻略圖" loading="lazy">
        <figcaption>唐樓命名攻略圖</figcaption>
      </figure>
      <p class="credit">圖片來源: HKU Digital Repository 「聯和大廈」售樓書</p>
    </details>
  </main>

  <script>
    // --- The naming model (mirrors app.py) ---
    var firstCharacters = {
      "時間": ["永", "恆"],
      "地方": ["海", "東"],
      "數量": ["富", "盛", "同", "萬", "廣", "長"],
      "意頭": ["寶", "順", "好", "榮"],
      "其他": ["金", "新"]
    };
    var lastCharacters = ["昌", "運", "利", "安", "勝", "發", "成", "豐", "益", "源", "裕", "基"];
    var suffix = ["大廈", "大樓", "樓"];

    function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

    // --- Build category checkboxes (all checked by default) ---
    var catsEl = document.getElementById("cats");
    Object.keys(firstCharacters).forEach(function (cat) {
      var label = document.createElement("label");
      label.className = "cat";
      var cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = true;
      cb.value = cat;
      label.appendChild(cb);
      label.appendChild(document.createTextNode(cat));
      catsEl.appendChild(label);
    });

    var errorEl = document.getElementById("error");
    var stageEl = document.getElementById("stage");
    var nameEl = document.getElementById("name");
    var tagcatEl = document.getElementById("tagcat");
    var copyEl = document.getElementById("copy");
    var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    // Seeded from the markup so copy/share work before the first generate.
    var currentName = nameEl.textContent;

    function render(name, category) {
      currentName = name;
      tagcatEl.textContent = category;
      nameEl.innerHTML = "";
      Array.prototype.forEach.call(name, function (ch, i) {
        var s = document.createElement("span");
        s.className = "char";
        s.textContent = ch;
        s.style.animationDelay = (0.22 + i * 0.075) + "s";
        nameEl.appendChild(s);
      });
      copyEl.textContent = "複製名稱";

      // Replay the reveal on every generate (replaces the Streamlit nonce):
      // strip .animate, force reflow so the browser registers the from-state,
      // then re-add on the next frame. Skipped under reduced-motion.
      stageEl.classList.remove("animate");
      if (!reduce) {
        void stageEl.offsetWidth;
        requestAnimationFrame(function () { stageEl.classList.add("animate"); });
      }
    }

    function generate() {
      var checked = Array.prototype.filter.call(
        catsEl.querySelectorAll("input"), function (cb) { return cb.checked; }
      ).map(function (cb) { return cb.value; });

      // Hero stays put on an empty selection — show the nudge, don't wipe the name.
      if (checked.length === 0) {
        errorEl.textContent = "請至少選擇一個字頭類別";
        return;
      }
      errorEl.textContent = "";
      var category = pick(checked);
      var name = pick(firstCharacters[category]) + pick(lastCharacters) + pick(suffix);
      render(name, category);
    }

    document.getElementById("generate").addEventListener("click", generate);
    copyEl.addEventListener("click", function () {
      if (!currentName || !navigator.clipboard) return;
      navigator.clipboard.writeText(currentName).then(function () {
        copyEl.textContent = "已複製 ✓";
        setTimeout(function () { copyEl.textContent = "複製名稱"; }, 1600);
      });
    });
  </script>
</body>
</html>
